name: Translation PR

on:
  push:
    branches:
      - i18n
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: translation-pr
  cancel-in-progress: false

jobs:
  pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.I18N_BOT_TOKEN || github.token }}

      # The pull request carries translations only. The docs live on the i18n branch and are
      # never meant to land on main, so the export branch starts from main and takes locales/.
      - name: Export the locales from i18n onto a branch off main
        id: export
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main i18n

          git checkout -B translation-export origin/main
          rm -rf locales
          git checkout origin/i18n -- locales
          git add locales

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The locales on i18n already match main, nothing to review."
            exit 0
          fi
          git diff --cached --name-only
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ensure pull request exists
        if: steps.export.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.I18N_BOT_TOKEN || github.token }}
        run: |
          git push --force origin HEAD:translation-export

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head translation-export --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Pull request #$existing already covers this branch; the force push refreshed it."
            exit 0
          fi

          changed="$(git diff --name-only origin/main...HEAD | sed 's/^/- `/; s/$/`/')"
          languages="$(git diff --name-only origin/main...HEAD | grep -oE '\.[A-Za-z]{2}(-[A-Za-z]{2,4})?\.(ya?ml|json)$' | sed 's/^\.//; s/\.\(ya\?ml\|json\)$//' | sort -u | sed 's/^/- /')"

          {
            echo "## Translation Update"
            echo
            echo "This PR was automatically exported from the \`i18n\` branch and carries the \`locales/\` files only."
            echo
            echo "### Languages"
            echo "${languages:-- unknown}"
            echo
            echo "### Files"
            echo "${changed:-- no file list}"
            echo
            echo "Please review before merging."
          } > pr-body.md

          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head translation-export \
            --title "i18n: update translations" --body-file pr-body.md
