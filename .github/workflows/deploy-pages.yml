name: Deploy Pages

on:
  push:
    branches:
      - i18n
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout the editor sources
        uses: actions/checkout@v4
        with:
          ref: editor
          path: _editor

      - name: Add the interface strings
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git archive FETCH_HEAD locales | tar -x -C _editor
          test -f _editor/locales/app.en.yml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _editor/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the editor
        run: |
          set -euo pipefail
          test -f _editor/source/vite.config.ts
          test -d _editor/locales
          npm ci --prefix _editor
          npm run editor:build --prefix _editor
          test -f _editor/source/dist/index.html

      - name: Build the docs and stage the editor
        run: |
          set -euo pipefail
          npm ci
          npm run build
          rm -rf docs/.vuepress/dist/Editor
          mkdir -p docs/.vuepress/dist/Editor
          cp -r _editor/source/dist/. docs/.vuepress/dist/Editor/
          touch docs/.vuepress/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
