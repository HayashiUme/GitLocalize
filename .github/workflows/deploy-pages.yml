name: Deploy Pages

on:
  push:
    branches:
      - i18n
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout the published editor
        uses: actions/checkout@v4
        with:
          ref: editor
          path: _editor

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the docs and stage the editor
        run: |
          set -euo pipefail
          test -f _editor/index.html
          npm ci
          npm run build
          rm -rf docs/.vuepress/dist/Editor
          cp -r _editor docs/.vuepress/dist/Editor

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
