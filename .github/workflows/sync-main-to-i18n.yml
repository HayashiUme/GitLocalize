name: Sync main to i18n

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-main-to-i18n
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.sync.outputs.pushed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.I18N_BOT_TOKEN || github.token }}

      # main is the source of truth for the app and its locale files only. The docs live
      # on the i18n branch and are built there from docs/package.json; a plain merge
      # would clobber them, so the sync copies the listed paths instead of merging.
      - name: Copy app paths from main into i18n
        id: sync
        env:
          SYNC_PATHS: '.github app android editor locales src tests capacitor.config.ts tsconfig.json README.md LICENSE .gitignore'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          echo "pushed=false" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --heads origin i18n >/dev/null 2>&1; then
            git checkout -B i18n origin/i18n
          else
            echo "The i18n branch does not exist yet, creating it from main."
            git checkout -B i18n origin/main
            git push origin i18n
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout origin/main -- $SYNC_PATHS
          git ls-tree -r --name-only origin/main -- $SYNC_PATHS | sort > /tmp/main-files
          git ls-tree -r --name-only HEAD -- $SYNC_PATHS | sort > /tmp/i18n-files
          comm -13 /tmp/main-files /tmp/i18n-files > /tmp/removed-files
          if [ -s /tmp/removed-files ]; then
            xargs -a /tmp/removed-files git rm --quiet --
          fi

          if git diff --cached --quiet; then
            echo "The synced paths already match main. Nothing to do."
            exit 0
          fi
          git commit -m "chore: sync app sources from main"
          git push origin HEAD:i18n
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger follow-up workflows
        if: steps.sync.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.I18N_BOT_TOKEN }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            echo "A bot token performed the push, so GitHub already started the dependent workflows."
            exit 0
          fi
          echo "Pushes made with the default token do not start workflow runs, dispatching them explicitly."
          gh workflow run translation-pr.yml --ref i18n || true
          gh workflow run deploy-pages.yml --ref i18n || true
