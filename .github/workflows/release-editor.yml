name: Release editor

# The editor is published on its own orphan branch so that the app repository carries no build
# output and the i18n branch does not need the editor toolchain. Consumers (other repositories
# running the deploy CLI) only ever see index.html + assets on that branch.

on:
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - 'src/**'
      - 'locales/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-editor
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run editor:build

      - name: Compose the release tree
        run: |
          set -euo pipefail
          mkdir -p _release
          cp -r editor/dist/. _release/
          touch _release/.nojekyll
          node -e "const fs=require('fs');fs.writeFileSync('_release/VERSION',JSON.stringify({sha:process.env.GITHUB_SHA,builtAt:new Date().toISOString()},null,2)+'\n')"
          test -f _release/index.html

      - name: Skip when the tree is unchanged
        id: diff
        run: |
          set -euo pipefail
          git init -q _release
          git -C _release add -A
          local_tree=$(git -C _release write-tree)
          if git ls-remote --exit-code --heads origin editor >/dev/null 2>&1; then
            git fetch --quiet --depth=1 origin editor
            remote_tree=$(git rev-parse 'origin/editor^{tree}')
          else
            remote_tree=missing
          fi
          echo "local=${local_tree} remote=${remote_tree}"
          if [ "$local_tree" = "$remote_tree" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the editor branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.I18N_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git -C _release config user.name "github-actions[bot]"
          git -C _release config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _release checkout -B editor
          git -C _release commit -m "build: editor from ${GITHUB_SHA}"
          git -C _release push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" editor

      - name: Rebuild the Pages site
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes made with the default token do not start workflow runs.
          gh workflow run deploy-pages.yml --ref i18n || true
