name: Release editor

# The editor sources live on the editor branch under source/, the build output sits at its root
# (it is the Pages source). This workflow borrows the shared src/ and locales/ from main, builds,
# and force-pushes the combined tree back to the editor branch.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'locales/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/release-editor.yml'
  schedule:
    # Daily safety net: catches editor-branch source edits, which cannot trigger a workflow
    # themselves (that branch carries no .github directory).
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-editor
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the editor sources
        run: |
          set -euo pipefail
          git fetch --depth=1 origin editor
          git archive FETCH_HEAD source src package.json package-lock.json | tar -x -C .
          test -f source/vite.config.ts
          test -f src/env.d.ts
          test -f package-lock.json
          test -d locales

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run editor:build

      - name: Compose the release tree
        run: |
          set -euo pipefail
          mkdir -p _release
          cp -r source/dist/. _release/
          git archive FETCH_HEAD source src tests package.json package-lock.json tsconfig.json vitest.config.ts .gitignore | tar -x -C _release
          touch _release/.nojekyll
          test -f _release/index.html
          test -f _release/source/vite.config.ts
          test ! -e _release/source/dist

      - name: Skip when the tree is unchanged
        id: diff
        run: |
          set -euo pipefail
          git init -q _release
          git -C _release add -A
          local_tree=$(git -C _release write-tree)
          if git ls-remote --exit-code --heads origin editor >/dev/null 2>&1; then
            git fetch --quiet --depth=1 origin editor
            remote_tree=$(git rev-parse 'origin/editor^{tree}')
          else
            remote_tree=missing
          fi
          echo "local=${local_tree} remote=${remote_tree}"
          if [ "$local_tree" = "$remote_tree" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the editor branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.I18N_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git -C _release config user.name "github-actions[bot]"
          git -C _release config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _release checkout -B editor
          git -C _release commit -m "build: editor from ${GITHUB_SHA}"
          git -C _release push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" editor

      - name: Rebuild the Pages site
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes made with the default token do not start workflow runs.
          gh workflow run deploy-pages.yml --ref i18n || true
