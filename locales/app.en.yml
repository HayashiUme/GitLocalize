# The strings this repository demonstrates translating. The editor's own interface
# language lives on the editor branch; what follows is a plain example of the kind
# of file a project hands to GitLocalize.

app:
  name: Acme Notes
  tagline: Your notes, everywhere
  nav:
    home: Home
    notes: Notes
    settings: Settings
  actions:
    newNote: New note
    save: Save
    cancel: Cancel
    delete: Delete
  messages:
    welcome: "Welcome back, {name}!"
    empty: No notes yet. Create your first one.
    saved: "{count} notes saved"
    unsaved: You have unsaved changes.
  errors:
    offline: You are offline. Changes will sync later.
    notFound: That note no longer exists.
