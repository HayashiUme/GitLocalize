# 本仓库用于演示翻译的文件。编辑器自己的界面文案在 editor 分支上，这里只是一个
# 普通的、交给 GitLocalize 翻译的示例文件。

app:
  name: 极客笔记
  tagline: 随处可记的笔记
  nav:
    home: 首页
    notes: 笔记
    settings: 设置
  actions:
    newNote: 新建笔记
    save: 保存
    cancel: 取消
    delete: 删除
  messages:
